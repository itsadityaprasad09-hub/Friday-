<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F4EFE6;
    --cream-dim: #EAE3D4;
    --espresso: #241C17;
    --espresso-soft: #322722;
    --greige: #A99A85;
    --greige-line: #DCD2BE;
    --gold: #C9A66B;
    --gold-soft: rgba(201,166,107,0.16);
    --danger: #B4553F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--espresso);
    color:var(--cream);
    overflow:hidden;
  }
  .display{font-family:'Fraunces', serif;}

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, rgba(201,166,107,0.10), transparent 55%),
      var(--espresso);
    z-index:50;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #lock.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .lock-card{
    width:min(88vw, 340px);
    text-align:center;
  }
  .lock-mark{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:6px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--gold);
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.6; }
    50%{ transform:scale(1.5); opacity:1; }
  }
  .lock-title{ font-size:2.1rem; font-weight:500; letter-spacing:0.5px; }
  .lock-sub{
    color:var(--greige); font-size:.82rem; margin-top:6px; letter-spacing:.3px;
  }
  .lock-form{ margin-top:34px; }
  .lock-input{
    width:100%;
    background:var(--espresso-soft);
    border:1px solid rgba(220,210,190,0.16);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    font-size:.95rem;
    padding:13px 16px;
    border-radius:10px;
    outline:none;
    letter-spacing:1px;
    text-align:center;
    transition:border-color .2s ease;
  }
  .lock-input:focus{ border-color:var(--gold); }
  .lock-error{
    color:var(--danger); font-size:.76rem; margin-top:10px; height:14px;
  }
  .lock-btn{
    margin-top:18px;
    width:100%;
    background:var(--gold);
    color:var(--espresso);
    border:none;
    padding:12px;
    border-radius:10px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:.88rem;
    letter-spacing:.4px;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  .lock-btn:active{ opacity:.8; }

  /* ---------- APP SHELL ---------- */
  #app{
    height:100vh;
    height:100dvh;
    width:100vw;
    display:flex;
    background:var(--cream);
    color:var(--espresso);
  }

  /* Sidebar */
  #sidebar{
    width:280px; min-width:280px;
    background:var(--espresso);
    color:var(--cream);
    display:flex; flex-direction:column;
    transform:translateX(-100%);
    transition:transform .32s cubic-bezier(.4,0,.2,1);
    position:absolute; top:0; bottom:0; left:0; z-index:30;
  }
  #sidebar.open{ transform:translateX(0); }
  @media(min-width:860px){
    #sidebar{ position:relative; transform:none; }
    #overlay{ display:none !important; }
  }
  #overlay{
    position:absolute; inset:0; background:rgba(0,0,0,.35);
    z-index:20; opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }

  .side-head{
    padding:20px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid rgba(220,210,190,0.1);
  }
  .side-brand{ display:flex; align-items:center; gap:9px; }
  .side-brand .dot{ width:6px; height:6px; }
  .side-brand span{ font-family:'Fraunces', serif; font-size:1.15rem; }
  .icon-btn{
    background:none; border:none; color:var(--greige);
    cursor:pointer; padding:6px; display:flex;
  }
  .icon-btn:hover{ color:var(--cream); }

  .side-scroll{ flex:1; overflow-y:auto; padding:14px 12px; }
  .side-section-label{
    font-size:.68rem; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--greige); padding:10px 8px 8px;
  }
  .new-chat-btn{
    width:100%; display:flex; align-items:center; gap:9px;
    background:var(--gold-soft); color:var(--gold);
    border:1px solid rgba(201,166,107,0.3);
    padding:11px 13px; border-radius:9px;
    font-family:'Work Sans'; font-size:.85rem; font-weight:500;
    cursor:pointer; margin-bottom:6px;
  }
  .app-chip{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; cursor:default;
    font-size:.83rem;
  }
  .app-chip:hover{ background:rgba(220,210,190,0.06); }
  .app-dot{ width:7px; height:7px; border-radius:50%; background:#7FA37C; flex-shrink:0; }
  .app-name{ flex:1; }
  .app-action{
    font-size:.7rem; color:var(--greige); background:none; border:none;
    cursor:pointer; letter-spacing:.3px;
  }
  .app-action:hover{ color:var(--danger); }
  .connect-app-btn{
    width:100%; text-align:left;
    background:none; border:1px dashed rgba(220,210,190,0.22);
    color:var(--greige); padding:9px 12px; border-radius:8px;
    font-size:.8rem; cursor:pointer; margin-top:2px;
  }
  .connect-app-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .history-item{
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:.83rem; color:var(--cream-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .history-item:hover{ background:rgba(220,210,190,0.06); }
  .history-item.active{ background:rgba(201,166,107,0.14); color:var(--gold); }

  /* Main panel */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  #topbar{
    display:flex; align-items:center; gap:14px;
    padding:16px 20px;
    border-bottom:1px solid var(--greige-line);
  }
  #topbar .side-brand span{ font-family:'Fraunces', serif; font-size:1.05rem; color:var(--espresso); }
  #topbar .dot{ background:var(--gold); }
  #topbar .icon-btn{ color:var(--espresso); opacity:.6; }
  #topbar .icon-btn:hover{ opacity:1; }

  #messages{
    flex:1; overflow-y:auto;
    padding:28px 20px;
    display:flex; flex-direction:column; gap:18px;
  }
  .msg{ max-width:min(78%, 560px); line-height:1.5; font-size:.92rem; }
  .msg.user{
    align-self:flex-end;
    background:var(--espresso); color:var(--cream);
    padding:11px 15px; border-radius:14px 14px 3px 14px;
  }
  .msg.friday{
    align-self:flex-start;
    color:var(--espresso);
    padding:2px 2px;
  }
  .msg.friday .who{
    font-family:'Fraunces', serif; font-size:.78rem; color:var(--gold);
    display:block; margin-bottom:4px; letter-spacing:.3px;
  }
  .empty-state{
    margin:auto; text-align:center; max-width:320px; color:var(--greige);
  }
  .empty-state .display{ font-size:1.6rem; color:var(--espresso); margin-bottom:8px; }
  .empty-state p{ font-size:.85rem; line-height:1.55; }

  #composer{
    padding:16px 20px 22px;
    border-top:1px solid var(--greige-line);
  }
  .composer-inner{
    display:flex; align-items:flex-end; gap:10px;
    background:#fff;
    border:1px solid var(--greige-line);
    border-radius:16px;
    padding:8px 8px 8px 14px;
  }
  .plus-btn{
    width:32px; height:32px; border-radius:50%;
    background:var(--cream-dim); border:none; color:var(--espresso);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; font-size:1.1rem;
  }
  .plus-btn:hover{ background:var(--gold-soft); color:var(--gold); }
  #composer textarea{
    flex:1; border:none; outline:none; resize:none;
    font-family:'Work Sans'; font-size:.92rem;
    background:transparent; color:var(--espresso);
    max-height:120px; padding:7px 0;
  }
  .send-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--espresso); color:var(--cream); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .send-btn:hover{ background:var(--gold); color:var(--espresso); }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(150,140,120,0.3); border-radius:10px; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-mark"><span class="dot"></span></div>
    <div class="lock-title display">Friday</div>
    <div class="lock-sub">enter your password to continue</div>
    <div class="lock-form">
      <input type="password" id="pwInput" class="lock-input" placeholder="Password" autocomplete="off">
      <div class="lock-error" id="pwError"></div>
      <button class="lock-btn" onclick="tryUnlock()">Unlock</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="overlay" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <div class="side-head">
      <div class="side-brand"><span class="dot"></span><span>Friday</span></div>
      <button class="icon-btn" onclick="closeSidebar()">✕</button>
    </div>
    <div class="side-scroll">
      <button class="new-chat-btn" onclick="newChat()">+ &nbsp;New chat</button>

      <div class="side-section-label">Connected apps</div>
      <div id="appList">
        <div class="app-chip">
          <span class="app-dot"></span>
          <span class="app-name">Chrome</span>
          <button class="app-action">disconnect</button>
        </div>
        <div class="app-chip">
          <span class="app-dot"></span>
          <span class="app-name">Play Store</span>
          <button class="app-action">disconnect</button>
        </div>
      </div>
      <button class="connect-app-btn" onclick="mockConnect()">+ Connect an app</button>

      <div class="side-section-label" style="margin-top:18px;">History</div>
      <div id="historyList">
        <div class="history-item active">New chat</div>
      </div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button class="icon-btn" onclick="openSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="side-brand"><span class="dot"></span><span>Friday</span></div>
    </div>

    <div id="messages">
      <div class="empty-state" id="emptyState">
        <div class="display">Kya karna hai aaj?</div>
        <p>Coding, website, ya kisi app ko connect karna — bata do, shuru karte hain.</p>
      </div>
    </div>

    <div id="composer">
      <div class="composer-inner">
        <button class="plus-btn" onclick="mockConnect()" title="Connect / attach">+</button>
        <textarea id="chatInput" rows="1" placeholder="Message Friday..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const PASSWORD = "Friday";

  function tryUnlock(){
    const val = document.getElementById('pwInput').value;
    const err = document.getElementById('pwError');
    if(val === PASSWORD){
      document.getElementById('lock').classList.add('hidden');
    } else {
      err.textContent = "Galat password";
      document.getElementById('pwInput').value = "";
    }
  }
  document.getElementById('pwInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') tryUnlock();
  });

  function openSidebar(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }
  function closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  function newChat(){
    document.getElementById('messages').innerHTML =
      '<div class="empty-state"><div class="display">Kya karna hai aaj?</div><p>Coding, website, ya kisi app ko connect karna — bata do, shuru karte hain.</p></div>';
    closeSidebar();
  }

  function mockConnect(){
    alert("Yahan app-connect flow aayega (OAuth login) — abhi ke liye placeholder hai.");
  }

  function handleKey(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;

    const messages = document.getElementById('messages');
    const empty = document.getElementById('emptyState');
    if(empty) empty.remove();

    const userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    userDiv.textContent = text;
    messages.appendChild(userDiv);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'msg friday';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = '<span class="who">Friday</span>...';
    messages.appendChild(typingDiv);
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      document.getElementById('typingIndicator').remove();

      const fridayDiv = document.createElement('div');
      fridayDiv.className = 'msg friday';
      fridayDiv.innerHTML = '<span class="who">Friday</span>' + (data.reply || data.error || 'Kuch gadbad hui.');
      messages.appendChild(fridayDiv);
      messages.scrollTop = messages.scrollHeight;
    } catch (err) {
      document.getElementById('typingIndicator').remove();
      const fridayDiv = document.createElement('div');
      fridayDiv.className = 'msg friday';
      fridayDiv.innerHTML = '<span class="who">Friday</span>Connect nahi ho pa raha — check karo API deploy hui hai ya nahi.';
      messages.appendChild(fridayDiv);
    }
  }
</script>
</body>
</html>
